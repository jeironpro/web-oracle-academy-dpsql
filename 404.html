<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · Oracle Academy</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: var(--space-xl);
      }
      .not-found {
        text-align: center;
        max-width: 42ch;
      }
      .not-found__code {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--color-muted);
      }
      .not-found__title {
        margin-top: var(--space-sm);
        font-size: var(--text-3xl);
      }
      .not-found__text {
        margin-top: var(--space-md);
        color: var(--color-muted);
      }
      .not-found__link {
        display: inline-block;
        margin-top: var(--space-lg);
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <p class="not-found__code">Error 404</p>
      <h1 class="not-found__title">Página no encontrada</h1>
      <p class="not-found__text">
        El documento que buscas no existe o se movió. Vuelve al índice del curso.
      </p>
      <a class="not-found__link" href="index.html">Volver al índice</a>
    </main>
  </body>
</html>
