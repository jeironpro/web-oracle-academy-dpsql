name: ci

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    install:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Guardar node_modules para jobs posteriores
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    lint:
        needs: install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npx prettier --check .

    test:
        needs: install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test

    security:
        needs: install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm audit --audit-level=moderate

    build:
        needs: [lint, test, security]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # El "build" de un sitio estático es verificar que el manifiesto está al día
            - name: Verificar manifiesto de contenido
              run: node tools/generate-manifest.js --check
