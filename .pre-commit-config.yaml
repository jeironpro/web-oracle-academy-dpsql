repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: trailing-whitespace
            exclude: ^oracle_academy/
          - id: end-of-file-fixer
            exclude: ^oracle_academy/
          - id: check-yaml
          - id: check-json
            exclude: ^data/manifest.json$
          - id: check-merge-conflict
          - id: check-added-large-files
            # El repositorio contiene PDFs del curso de hasta ~20 MB
            args: ["--maxkb=1048576"]

    - repo: local
      hooks:
          - id: prettier
            name: prettier
            entry: npx prettier --write
            language: system
            files: \.(html|css|js|json|md)$
            exclude: ^oracle_academy/|^data/manifest.json$|^package-lock\.json$
          - id: eslint
            name: eslint
            entry: npx eslint --fix
            language: system
            files: \.js$
            exclude: ^oracle_academy/
