<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visor · Oracle Academy</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Visor de documentos del curso Programación de Base de Datos SQL de Oracle Academy: lee los PDF en el navegador y descarga los archivos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/visor.css" />
  </head>
  <body>
    <a class="enlace-salto" href="#visor-documento">Saltar al visor</a>

    <header class="visor-barra">
      <nav class="visor-barra__migas" aria-label="Migas de pan">
        <a class="visor-barra__enlace" href="index.html">Índice</a>
        <span class="visor-barra__separador" aria-hidden="true">/</span>
        <a class="visor-barra__enlace" id="miga-tema" href="index.html">Tema</a>
        <span class="visor-barra__separador" aria-hidden="true">/</span>
        <span class="visor-barra__actual" id="miga-archivo" aria-current="page">Documento</span>
      </nav>
      <div class="visor-barra__acciones">
        <a class="btn btn--cyan" id="enlace-descarga" href="index.html" download>
          <span class="material-symbols-outlined" aria-hidden="true">download</span>
          <span>Descargar</span>
        </a>
      </div>
    </header>

    <main class="visor" id="visor-documento">
      <div class="visor__encabezado">
        <p class="visor__etiqueta" id="etiqueta-archivo">Documento</p>
        <h1 class="visor__titulo" id="titulo-archivo">Cargando…</h1>
        <p class="visor__meta" id="meta-archivo"></p>
      </div>

      <div class="visor__marco">
        <iframe
          class="visor__pdf"
          id="visor-pdf"
          title="Vista previa del documento"
          aria-label="Vista previa del documento PDF"
        ></iframe>
        <div class="visor__fallo" id="visor-fallo" hidden>
          <p class="visor__fallo-titulo">No se pudo previsualizar el documento</p>
          <p class="visor__fallo-texto">
            El PDF puede estar protegido o el navegador no permite su vista previa. Puedes
            descargarlo desde el botón superior.
          </p>
        </div>
        <noscript>
          <p class="visor__noscript">Activa JavaScript para ver el documento en el navegador.</p>
        </noscript>
      </div>
    </main>

    <footer class="visor-pie" aria-label="Navegación entre documentos del tema">
      <a class="visor-pie__enlace" id="enlace-anterior" href="index.html" hidden>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
        <span>Anterior</span>
      </a>
      <p class="visor-pie__posicion" id="posicion-documento"></p>
      <a class="visor-pie__enlace" id="enlace-siguiente" href="index.html" hidden>
        <span>Siguiente</span>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </a>
    </footer>

    <script type="module" src="js/visor.js"></script>
  </body>
</html>
