<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Programación de Base de Datos SQL · Oracle Academy</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Índice completo del curso Programación de Base de Datos SQL de Oracle Academy (DPSQL 47–50): temas, lecciones, prácticas y recursos para leer o descargar."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/catalogo.css" />
  </head>
  <body>
    <a class="enlace-salto" href="#contenido">Saltar al contenido</a>

    <header class="barra-superior">
      <button
        class="boton-menu"
        id="boton-menu"
        type="button"
        aria-label="Abrir menú de temas"
        aria-expanded="false"
        aria-controls="panel-lateral"
      >
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
      <a class="barra-superior__marca-enlace" href="index.html">
        <img
          class="marca__logo"
          src="favicon.svg"
          alt=""
          width="28"
          height="28"
          aria-hidden="true"
        />
        <span class="marca__texto">Oracle Academy · DPSQL 47–50</span>
      </a>
      <div class="barra-superior__busqueda">
        <label class="sr-only" for="campo-busqueda">Buscar en el curso</label>
        <div class="busqueda__control">
          <span class="busqueda__icono material-symbols-outlined" aria-hidden="true">search</span>
          <input
            id="campo-busqueda"
            class="busqueda__input"
            type="search"
            placeholder="Buscar lección, práctica o tema…"
            autocomplete="off"
          />
          <kbd class="busqueda__tecla" id="tecla-busqueda" aria-hidden="true">Ctrl K</kbd>
        </div>
      </div>
    </header>

    <div class="aplicacion">
      <aside class="panel" id="panel-lateral" aria-label="Temas del curso">
        <p class="panel__cabecera eyebrow">Temario</p>
        <nav class="panel__nav" id="panel-navegacion" aria-label="Navegación por temas"></nav>
      </aside>
      <div class="panel__velo" id="panel-velo" hidden></div>

      <main class="contenido" id="contenido">
        <div id="vista-contenido"></div>

        <footer class="colofon">
          <p>oracle-academy-dpsql</p>
          <p>jeironpro · 2026</p>
        </footer>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
